name: CI
on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform rather than cancelling the rest on the first
      # failure; the point of the macOS and Windows jobs is to find out what
      # breaks there.
      fail-fast: false
      matrix:
        # Spelled out per platform because the architectures differ:
        # GitHub's macOS runners are Apple Silicon, and Algencan has had an
        # aarch64 specific bug before, so that is the interesting one to test.
        include:
          - os: ubuntu-latest
            arch: x64
            version: '1.10'
          - os: macOS-latest
            arch: aarch64
            version: '1.10'
          - os: windows-latest
            arch: x64
            version: '1.10'
    steps:
      - uses: actions/checkout@v1
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # CUTEst, a test dependency, compiles decoded SIF problems at run time and
      # so needs a Fortran compiler on the machine. The Linux runners ship one
      # and CUTEst supplies its own on Windows, but macOS has neither. This is a
      # requirement of the test harness only: the package itself needs no
      # compiler, which is the point of taking the binary from Algencan_jll.
      - name: Install gfortran (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          # CUTEst looks for `gfortran`; Homebrew may only provide gfortran-NN.
          if ! command -v gfortran >/dev/null; then
            latest=$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -1)
            ln -sf "$latest" "$(brew --prefix)/bin/gfortran"
          fi
          gfortran --version
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      # Documentation and coverage are published once, from Linux. Running them
      # on every platform would have the three jobs racing to deploy the same
      # docs and uploading three coverage reports for one commit.
      - uses: julia-actions/julia-docdeploy@latest
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v1
        if: matrix.os == 'ubuntu-latest'
        with:
          file: lcov.info
